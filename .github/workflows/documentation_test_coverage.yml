name: Deploy Documentation and Test Coverage to GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy ultralytics

      - name: Run Tests and Generate Coverage Report
        run: |
          cd yolo_models
          export PYTHONPATH=$GITHUB_WORKSPACE/yolo_models
          pytest --cov=scripts --cov-report=html

      - name: Copy Coverage Report to Docs Folder
        run: |
          mkdir -p doxyfiles/docs/coverage
          cp -r yolo_models/htmlcov/* doxyfiles/docs/coverage/

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: |
          cd doxyfiles
          doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: doxyfiles/docs
          token: ${{ secrets.GITHUB_TOKEN }}
          force: true
          clean: true
          clean-exclude: |
            .git
            .gitignore

          